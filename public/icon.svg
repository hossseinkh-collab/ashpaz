<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer gold accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Center Chef Toque / Crown & Flame Motif -->
  <g transform="translate(256, 260) scale(1.15) translate(-128, -140)">
    <!-- Base Ribbon of Hat -->
    <path d="M 60 190 Q 128 205 196 190 L 190 220 Q 128 235 66 220 Z" fill="url(#gold)" filter="url(#glow)"/>
    <rect x="66" y="200" width="124" height="15" rx="7.5" fill="#fef08a" opacity="0.8" />

    <!-- Hat Puff / Clouds -->
    <path d="M 64 185
             C 30 165, 30 120, 65 105
             C 55 60, 110 40, 128 75
             C 150 35, 205 60, 195 105
             C 230 120, 230 165, 196 185
             Z" fill="#ffffff" />

    <!-- Hat Pleats -->
    <path d="M 85 180 C 85 130 95 95 100 85" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 128 185 C 128 125 128 90 128 76" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 171 180 C 171 130 161 95 156 85" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Central Saffron / Culinary Flame Emblem -->
    <path d="M 128 120
             C 115 140, 105 160, 120 180
             C 125 185, 131 185, 136 180
             C 151 160, 141 140, 128 120 Z" fill="url(#flame)" />

    <!-- Sparkle Stars -->
    <circle cx="50" cy="80" r="5" fill="#fde047" />
    <circle cx="210" cy="80" r="4" fill="#fde047" />
    <circle cx="128" cy="28" r="6" fill="#fde047" />
  </g>
</svg>
